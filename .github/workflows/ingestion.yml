name: Ingestion

# Runs only when the ingestion code (or this workflow) changes.
on:
  pull_request:
    paths:
      - "ingestion/**"
      - ".github/workflows/ingestion.yml"
  push:
    branches: [main]
    paths:
      - "ingestion/**"
      - ".github/workflows/ingestion.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
